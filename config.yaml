# paper-review 配置文件
# 参考 src/paper_review/config.py 中的 Config 模型查看所有可用字段
# 环境变量覆盖：PAPER_REVIEW_XXX（优先级高于 YAML）
#
# data_dir 优先级：--data-dir 参数 > ./.paper-review/ 存在 > ~/.paper-review/（自动创建）
# 以下路径留空 = 自动从 data_dir 推导：
#   index_dir → {data_dir}/index/
#   pdf_dir   → {data_dir}/pdfs/
# model_cache_dir 始终在 ~/.cache/paper-review/models/（不受 data_dir 影响）

# --- 数据目录 ---
# (注释掉 = 自动解析)
# data_dir: ~/.paper-review

# 索引存储目录（留空则自动推导为 {data_dir}/index）
# index_dir: ./data/index

# PDF 论文目录（留空则自动推导为 {data_dir}/pdfs）
# pdf_dir: ./data/history

# 模型缓存目录（默认 ~/.cache/paper-review/models，不依赖 data_dir）
# 默认值已展开为绝对路径；如需自定义请写绝对路径（~ 会被 expanduser 展开）
# model_cache_dir: ~/.cache/paper-review/models

# --- 分块参数 ---
chunk_size: 512
chunk_overlap: 128

# --- 位置权重（已废弃，不再影响检索）---
# 文档向量退役后（ADR 0006），加权 Mean Pooling 不再使用；以下权重字段仅用于
# 标记 chunk 的位置权重（position_weight），当前检索路径不读取该值，保留仅为兼容。
# head_weight: 5.0
# body_weight: 2.0
# tail_weight: 4.0
# head_ratio: 0.15
# tail_ratio: 0.10

# --- 检索参数 ---
recall_k: 50 # RRF 融合后的候选数
rrf_k: 60 # RRF 融合常量


# --- 模型选择 ---
# embedding_model: BAAI/bge-small-zh-v1.5
# reranker_model: BAAI/bge-reranker-v2-m3
