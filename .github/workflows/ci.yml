name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.10"

jobs:
  quality:
    name: "Format & Lint"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system ruff

      - name: ruff format check
        run: uv run ruff format --check .

      - name: ruff lint check
        run: uv run ruff check src/

  unit-tests:
    name: "单元测试 (py${{ matrix.python-version }})"
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system -e .[dev]

      - name: Run unit tests
        run: >
          uv run pytest tests/ -q
          -m "not integration"
          --junitxml=junit-unit-${{ matrix.python-version }}.xml

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-unit-${{ matrix.python-version }}
          path: junit-unit-${{ matrix.python-version }}.xml

  integration-tests:
    name: "集成测试"
    runs-on: ubuntu-24.04
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Install Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system -e .[dev]

      - name: Run integration tests
        run: >
          uv run pytest tests/ -q
          -m "integration"
          --junitxml=junit-integration.xml

      - name: Upload integration test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-integration
          path: junit-integration.xml

  e2e-smoke:
    name: "E2E Smoke (CLI)"
    runs-on: ubuntu-24.04
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Install Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system -e .[dev]

      - name: Run e2e smoke tests
        run: |
          uv run paper-review --help
          uv run python -m paper_review --help
          uv run pytest tests/e2e/ -v -m e2e --junitxml=junit-e2e.xml

      - name: Upload e2e test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-e2e
          path: junit-e2e.xml
