[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-rag"
version = "0.1.0"
description = "Local paper retrieval service - hybrid BM25 + vector search for review pipelines"
requires-python = ">=3.10"
dependencies = [
  "pymupdf>=1.23.0",
  "typer>=0.9.0",
  "pydantic>=2.0.0",
  "faiss-cpu>=1.7.0",
  "sentence-transformers>=2.2.0",
  "rank-bm25>=0.2.0",
  "flask>=2.3.0",
  "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
