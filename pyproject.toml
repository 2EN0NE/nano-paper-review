[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-rag"
version = "0.1.0"
description = "Offline paper review pipeline — BM25 + FAISS hybrid search + ONNX reranker"
requires-python = ">=3.10"
dependencies = [
  "pymupdf>=1.23.0",
  "typer>=0.9.0",
  "pydantic>=2.0.0",
  "faiss-cpu>=1.7.0",
  "onnxruntime>=1.15.0",
  "tokenizers>=0.15.0",
  "rank-bm25>=0.2.0",
  "flask>=2.3.0",
  "pyyaml>=6.0",
]

[project.scripts]
paper-review = "paper_rag.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]
exclude = ["prototype/", "scripts/", "pipeline/"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "N", "UP", "S"]
ignore = [
  "E501", # line-too-long: handled by formatter
  "S101", # allow assert in tests
]

[tool.ruff.lint.per-file-ignores]
"src/paper_rag/cli.py" = ["UP007"]
"tests/*.py" = ["S108"]               # allow temp paths in tests
"tests/e2e/*.py" = ["S603", "S607"]   # subprocess calls for CLI smoke test
"src/paper_rag/config.py" = ["UP045"] # pre-existing: Optional[X] style
# (models.py and reranker.py no longer use lazy type imports)
"src/paper_rag/orchestrator.py" = [
  "S603",
] # pre-existing: intended subprocess use
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
# E2E tests require the installed package (not PYTHONPATH=src).
# Run via: make test-e2e  or  python -m pytest tests/e2e/ -v
markers = [
  "integration: tests that span multiple components (HTTP, filesystem, FAISS persistence)",
  "e2e: end-to-end tests that run against the installed package (CLI entry point, smoke)",
]
