# 标准论文评审管线配置
# output_dir 现在由 CLI 从 data_dir 自动推导（{data_dir}/output/），
# 此文件中的 output_dir 会被 CLI 的 --data-dir 或自动解析的 data_dir 覆盖。
# 如需手动指定，取消下行注释：
# output_dir: ./output

name: "标准论文评审管线"
version: "1.0"

pre:
  directory: pre-review/
  retry:
    max_attempts: 2
    on_failure: skip

review:
  directory: review-pipeline/
  retry:
    max_attempts: 1
    on_failure: skip
  subject_order:
    sort_by: name
    direction: asc

post:
  directory: post-review/
  retry:
    max_attempts: 2
    on_failure: skip
