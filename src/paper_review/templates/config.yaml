# paper-review 配置文件
# 搜索路径（高→低）：此文件 > cwd/config.yaml > 默认值
# 环境变量覆盖：PAPER_REVIEW_XXX（如 PAPER_REVIEW_CHUNK_SIZE=256）

# ── 目录配置 ──
# data_dir 优先由 CLI --data-dir 指定，或自动使用 ./.paper-review/ / ~/.paper-review/
# 以下路径留空则从 data_dir 自动推导
index_dir: "" # 索引目录（默认: {data_dir}/index）
pdf_dir: "" # PDF 源文件目录（默认: {data_dir}/origin/pdf/）
# 注：参考论文归档目录的权威配置在 pipelines/{name}/pipeline.yaml 的 index.reference_dir 字段

# ── 分块参数 ──
chunk_size: 512 # 每个 Chunk 的字符数
chunk_overlap: 128 # Chunk 间重叠字符数

# ── 文档向量加权 Mean Pooling 参数 ──
# 按文档位置三段加权：头部（标题/摘要）、正文、尾部（结论）
head_weight: 5.0 # 头部权重
body_weight: 2.0 # 正文权重
tail_weight: 4.0 # 尾部权重
head_ratio: 0.15 # 头部占比（文档前 15%）
tail_ratio: 0.10 # 尾部占比（文档后 10%）

# ── 检索参数 ──
recall_k: 50 # RRF 融合前的候选集大小
final_top_n: 5 # 最终返回结果数
rrf_k: 60 # 倒数排序融合（RRF）常数

# ── 模型 ──
# 模型文件按目录名存储于 model_cache_dir 下
# （BAAI/bge-small-zh-v1.5 → 目录名 BAAI--bge-small-zh-v1.5）。
# 选中的模型由 `paper-review config` / install.sh 自动写入（会覆盖下面两个值）。
# reranker 默认：BAAI/bge-reranker-v2-m3（Apache 2.0，契约匹配、逐对精排经真实模型验证）；
#   备选：Qwen/Qwen3-Reranker-0.6B（Apache 2.0）。
# 注意：jina-reranker-v3 已移除——s-lorin 导出的 (1,2) logits 是整块 prompt 的全局
# 分数而非每文档分数，逐对精排不可用（真实模型验证）。
# 注意：下载只拉取单个 INT8 量化版本（onnx-community 仓库含多个变体，整仓下载会是提示的 3-5 倍）
embedding_model: "BAAI/bge-small-zh-v1.5"
reranker_model: "BAAI/bge-reranker-v2-m3"
vector_dim: 512

# ── 模型推理并行度 ──
# 每个值 = 独立模型实例数（每实例一个 ONNX session + tokenizer，内存随实例数翻倍）。
# 背景：tokenizers.Tokenizer 官方声明非线程安全 → 并发 N 需要 N 个独立实例；
# 实例数 = 并发上限（多余请求排队），并发推理共享 CPU 会互相拖慢。
# 默认 1（串行）：2C/4G 目标机器上内存吃紧、并发收益低；更强机器
# （≥4 核 / 内存充足）可调高 embedding_workers 减少并发查询排队。
# reranker 建议保持 1：50 候选逐条精排单次 10-40s，并发无收益。
embedding_workers: 1
reranker_workers: 1

# ── Worker 池全局默认值 ──
# 管线级别的并发配置（profile / workers_min / workers_max / timeout）在
# pipelines/{name}/pipeline.yaml 的 review.pool 段设置，会覆盖此处的全局默认值
pool_workers: 5 # 默认并发 Worker 数（0=自动，1=顺序执行）
pool_timeout: 0 # 默认单 Subject 超时秒数（0=无超时）
