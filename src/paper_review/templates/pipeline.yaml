# ═══════════════════════════════════════════════════════════════════════════
#  标准论文评审管线 — pipeline.yaml
# ═══════════════════════════════════════════════════════════════════════════
#
#   管线 = phases 列表，每个阶段有 mode（batch 或 per_subject）。
#   Step 可以是 .py 脚本或 .md Agent 提示词。
#
#   .md Step 支持模板变量：
#     {subject.name}              —— 论文文件名
#     {subject.text}              —— 论文全文
#     {intermediates.XX.data.YY}  —— 前置步骤的输出数据
#
#   解析时变量（在 pipeline.yaml 自身中使用）：
#     {{ output_dir }}            —— 输出根目录
#
#   详细文档：docs/PIPELINE.md
#   ═══════════════════════════════════════════════════════════════════════════

name: "标准论文评审管线"
version: "2.0"

# ── 全局 Agent（Agent 步骤）启动配置 ─────────────────────────────────
# 所有 .md 步骤和 .py 步骤内调 Agent 的类型与默认 provider/model。
# type: pi 为当前唯一支持（opencode 预留未实现）。
# provider/model 留空 = 不传 flag，继承 Agent 默认（pi 跟随 PI_PROVIDER/PI_MODEL 会话）。
# escalate = 升级链（Agent Escalation Chain，ADR 0017）：第 N 次尝试用第 N 条命令，
#   超出链长复用末条（顶部饱和）。留空 = 不启用升级链，回退 provider/model 单命令路径。
#   默认两条均用默认命令，与各 phase 的 retry.max_attempts=2 对齐——开箱即用不会执行
#   占位模型。需要“换更强模型再试”时，把第 2 条替换为：
#     - "pi -ne --model <你的模型名>"   # 第 2 次：升级到指定模型
agent:
  type: pi
  escalate:
    - "pi -ne" # 第 1 次：默认（继承会话模型）
    - "pi -ne" # 第 2 次：默认（可替换为 --model <模型名> 实现升级）

phases:
  # ── Pre Phase（批量执行）────────────────────────────────────────────────
  # mode=batch: 所有待审 Subject 依次执行每个 Step（不并行）。
  # 用途：格式归一化（doc→PDF）、自动建索引、批量预检索相似 Reference（模型加载一次）、
  #       关键词提取（从 Subject 首段提取，作为辅助信号）。
  - name: pre
    mode: batch
    directory: pre-review/ # 步骤脚本目录（相对于此 yaml 所在目录）
    display_name: 预处理 # 进度卡/报告显示名（空 → name 首字母大写）
    # manifest_step: 产 subject-manifest.json 的 step 名称（不含扩展名）
    manifest_step: "01-convert"
    # duplicate_policy: 同名 Subject 去重策略
    #   skip   — 以先出现的为准，后出现的跳过（默认）
    #   rename — 自动加后缀（如 论文A-1）
    #   error  — 终止管线报告冲突
    duplicate_policy: skip
    retry:
      max_attempts: 2 # Step 失败时的重试次数
      on_failure: skip # 重试仍失败时的策略: skip（跳过）或 abort（终止管线）
    # 可选：phase 级覆盖 model——特征抽取（04-extract-features）是结构化输出，
    # 用 non-reasoning 模型更稳定（reasoning 模型易“走神”）。留空 = 继承全局/会话默认。
    # agent:
    #   model: ""  # 替换为你的 non-reasoning 模型名

  # ── Review Phase（逐篇执行）──────────────────────────────────────────────
  # mode=per_subject: 每篇论文独立走完所有 Step，互不干扰。
  # 用途：Agent 逐维度评审 → 综合打分（检索结果与关键词由 Pre 阶段批量预检索注入）。
  # 特点：支持 Worker 池并发处理多篇论文。
  - name: review
    mode: per_subject
    directory: review-pipeline/ # 步骤脚本目录
    display_name: 逐篇评审 # 进度卡/报告显示名（空 → name 首字母大写）
    # subject_source: Subject 来源声明
    #   type: manifest — 从 {{ output_dir }}/subject-manifest.json 读取
    #   type: cli       — 直接从 CLI 输入路径发现（默认）
    subject_source:
      type: manifest
      path: "{{ output_dir }}/subject-manifest.json"
    duplicate_policy: skip
    retry:
      max_attempts: 2 # 重试 1 次（Agent 评审可能因 API 波动超时）
      on_failure: skip

    # ── Subject 排序 ──
    # 控制论文的执行顺序，影响 Worker 池调度的公平性。
    subject_order:
      sort_by: name # 排序字段: name / regex
      direction: asc # asc 升序 / desc 降序

    # ── Worker 池配置 ──
    # 控制并发度。多 Subject 时并行提速，单 Subject 时退化顺序。
    pool:
      workers: 3 # 初始并发 Worker 数（1=顺序, 0=自动）
      profile: dynamic # 并发策略：fixed（固定）| dynamic（自适应）
      workers_min: 1 # dynamic 模式最小 worker 数
      workers_max: 5 # dynamic 模式最大 worker 数
      granularity: subject # worker 拆分粒度：subject（一个 Subject 跑完全部 Steps）
      #            | step（按 Step 分波次，波内多 Subject 并行）
      timeout: 600 # 单个 Subject 超时秒数（10分钟/篇，.md Agent 步骤可能较慢）；step 粒度下为单步超时上限
      ordered: true # 是否按 Subject 原始顺序返回结果

  # ── Post Phase（批量执行）───────────────────────────────────────────────
  # mode=batch: 所有 Subject 完成 Review 后统一执行。
  # 用途：标签反写索引、报告归档（JSON + MD）、Excel 汇总、通知等收尾任务。
  - name: post
    mode: batch
    directory: post-review/
    display_name: 后处理 # 进度卡/报告显示名（空 → name 首字母大写）
    duplicate_policy: skip
    retry:
      max_attempts: 2
      on_failure: skip
