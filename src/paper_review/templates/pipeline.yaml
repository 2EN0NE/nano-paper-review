# ═══════════════════════════════════════════════════════════════════════════
#  标准论文评审管线 — pipeline.yaml
# ═══════════════════════════════════════════════════════════════════════════
#
#   管线 = phases 列表，每个阶段有 mode（batch 或 per_subject）。
#   Step 可以是 .py 脚本或 .md Agent 提示词。
#
#   .md Step 支持模板变量：
#     {subject.name}              —— 论文文件名
#     {subject.text}              —— 论文全文
#     {intermediates.XX.data.YY}  —— 前置步骤的输出数据
#
#   解析时变量（在 pipeline.yaml 自身中使用）：
#     {{ output_dir }}            —— 输出根目录
#
#   详细文档：docs/PIPELINE.md
#   ═══════════════════════════════════════════════════════════════════════════

name: "标准论文评审管线"
version: "2.0"

phases:
  # ── Pre Phase（批量执行）────────────────────────────────────────────────
  - name: pre
    mode: batch
    directory: pre-review/
    manifest_step: "00-convert"
    duplicate_policy: skip
    retry:
      max_attempts: 2
      on_failure: skip

  # ── Review Phase（逐篇执行）──────────────────────────────────────────────
  - name: review
    mode: per_subject
    directory: review-pipeline/
    subject_source:
      type: manifest
      path: "{{ output_dir }}/subject-manifest.json"
    duplicate_policy: skip
    retry:
      max_attempts: 1
      on_failure: skip
    subject_order:
      sort_by: name
      direction: asc
    pool:
      workers: 5
      timeout: 600
      ordered: true

  # ── Post Phase（批量执行）───────────────────────────────────────────────
  - name: post
    mode: batch
    directory: post-review/
    duplicate_policy: skip
    retry:
      max_attempts: 2
      on_failure: skip
